[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-extraction"
version = "0.1.0"
description = "Local, source-grounded tender question extraction"
requires-python = ">=3.10"
dependencies = ["openai>=3.14.1,<4", "pydantic>=2.13,<3", "openpyxl>=3.1.5,<4", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tender_extraction = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
